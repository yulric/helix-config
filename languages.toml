[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "markdown"
language-servers = ["harper-ls"]
auto-format = true
formatter = { command = "dprint-markdown" }

[[language]]
name = "quarto"
# harper-ls recognizes "quarto", not Helix's default "qmd".
language-id = "quarto"
language-servers = ["harper-ls"]
auto-format = true
formatter = { command = "dprint-markdown" }

# Web languages are formatted with Prettier using the project's own config.
# See prettier-stdin in flake.nix.

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettier-stdin", args = ["%{buffer_name}"] }

